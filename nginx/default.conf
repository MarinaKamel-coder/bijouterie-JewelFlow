server {
    listen 80;
    server_name localhost;

    # --- Configuration du FRONTEND (React / Vite) ---
    location / {
        proxy_pass http://client:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Pour éviter les erreurs lors du rafraîchissement des pages React
        proxy_intercept_errors on;
        error_page 404 = /index.html;
    }

    # --- Configuration de l'API (Node.js) ---
    location /api {
        # On redirige vers le service 'api' sur le port 5000
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Sécurité supplémentaire
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Optimisation des performances (Gzip) ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}